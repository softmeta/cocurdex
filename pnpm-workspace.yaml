packages:
  - apps/*
  - packages/*
  - tests/*
  - tests/unit/*
registries:
  default: https://registry.npmjs.org/
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
# electron-builder/@electron/rebuild pulls node-abi@4.29 which only maps
# Electron through 42; Electron 43.x needs node-abi >= 4.33.
overrides:
  '@babel/core': ^7.29.1
  '@hono/node-server': ^1.19.15
  '@modelcontextprotocol/sdk': ^1.32.1
  # Keep a single @types/node copy per program; mixed copies break
  # EventEmitter member resolution (ChildProcess.on/once). Pin the range
  # so transitive deps cannot pull a second major version.
  '@types/node': ^24.19.2
  node-abi: ^4.33.0
  body-parser: ^2.3.0
  brace-expansion: ^5.0.9
  dompurify: 3.4.13
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  hono: ^4.12.25
  ip-address: ^10.3.1
  mermaid: 11.16.1
  nanoid: ^3.3.18
  postcss: ^8.5.18
  postcss-selector-parser@^7: 7.1.5
  protobufjs: ^7.6.5
  qs: ^6.15.2
  sharp: ^0.35.4
  tar: 7.5.21
  undici: ^8.9.0
  '@vitest/mocker>vite': 7.3.5
  'vite-node>vite': 7.3.5
  'vitest>vite': 7.3.5
  ws: ^8.21.0
  nwsapi: 2.2.23
  # pptxgenjs lists the npm placeholder package `https` (no entry file),
  # which shadows the Node builtin for every bundled dependency.
  'pptxgenjs>https': '-'
allowBuilds:
  '@biomejs/biome': true
  '@google/genai': false
  '@swc/core': true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: false
  lefthook: true
  msgpackr-extract: false
  msw: true
  node-pty: true
  protobufjs: false
  react-native-enriched-markdown: true
  # next/image optimization (apps/console)
  sharp: true
patchedDependencies:
  '@earendil-works/pi-coding-agent@1.3.0': patches/@earendil-works__pi-coding-agent@1.3.0.patch
  '@expo/ui@58.0.22': patches/@expo__ui@58.0.22.patch
  react-native-enriched-markdown@1.1.1: patches/react-native-enriched-markdown@1.1.1.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
