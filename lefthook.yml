
no_tty: true

pre-commit:
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: node node_modules/@biomejs/biome/bin/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: design-tokens
            run: node ./scripts/lint-design-tokens.mjs
          - name: theme-parity
            glob: "apps/desktop/src/styles/theme-tokens.css"
            run: node ./scripts/lint-theme-parity.mjs
    - group:
        parallel: true
        jobs:
          - name: typecheck
            glob: "{apps/desktop/src/**/*.{ts,tsx},apps/desktop/*.config.ts,apps/desktop/tsconfig*.json,apps/desktop/package.json,packages/*/src/**/*.{ts,tsx},packages/*/package.json,packages/*/tsconfig*.json}"
            run: node ./node_modules/typescript/bin/tsc --noEmit --incremental --tsBuildInfoFile apps/desktop/.tsbuildinfo -p apps/desktop/tsconfig.json
