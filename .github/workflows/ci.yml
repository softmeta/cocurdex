name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  changes:
    name: Detect desktop changes
    runs-on: ubuntu-latest
    outputs:
      run_desktop: ${{ steps.scope.outputs.run_desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect desktop scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "run_desktop=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          run_desktop=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/ci.yml|.npmrc|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json|tsconfig.json|apps/cli/*|apps/desktop/*|packages/agent-adapters/*|packages/agent-core/*|packages/daemon/*|packages/db/*|packages/llm-chat/*|packages/product-skills/*|packages/rpc/*|packages/shared/*)
                run_desktop=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")

          echo "run_desktop=${run_desktop}" >> "${GITHUB_OUTPUT}"

  workspace:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check design tokens
        run: pnpm lint:design-tokens
      - name: Check theme parity
        run: pnpm lint:theme-parity
      - name: Check desktop translations
        run: pnpm --filter @cocurdex/desktop i18n:lint
      - name: Check desktop dependency cycles
        run: pnpm --filter @cocurdex/desktop lint:cycles

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run_desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop
        run: pnpm --filter @cocurdex/desktop typecheck
      - name: Test desktop
        run: pnpm --filter @cocurdex/desktop test
      - name: Build desktop
        if: runner.os == 'macOS'
        run: pnpm --filter @cocurdex/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
