name: Web release

on:
  push:
    tags:
      - "web-v*.*.*"

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build and publish the web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#web-}"
          name="cocurdex-web-${version}"
          pnpm install --frozen-lockfile
          pnpm --filter @cocurdex/desktop build
          node apps/web/scripts/package.mjs --out "build/${name}"
          mkdir -p dist
          tar -C build -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/* \
            --title "Web ${VERSION#web-}" \
            --notes "Cocurdex web client. Serve the extracted folder as static files; it reaches computers through the relay in each pairing link." \
            --latest=false
