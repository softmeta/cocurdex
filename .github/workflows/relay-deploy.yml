name: Relay deploy

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Relay release tag to deploy (relay-vX.Y.Z); ignored for rollback
        type: string
        required: false
      action:
        description: Deploy the tag or roll back to the previous release
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

concurrency:
  group: relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the official relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: relay-production
      url: https://relay.cocurdex.com
    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ vars.RELAY_DEPLOY_HOST }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.RELAY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.RELAY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/relay_deploy
          chmod 0600 ~/.ssh/relay_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host relay
            HostName ${DEPLOY_HOST}
            User cocurdex-deploy
            IdentityFile ~/.ssh/relay_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Roll back
        if: env.ACTION == 'rollback'
        run: ssh relay rollback

      - name: Download the release package
        if: env.ACTION == 'deploy'
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^relay-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          version="${TAG#relay-}"
          arch="$(ssh relay arch)"
          package="cocurdex-relay-${version}-linux-${arch}.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$package" --pattern SHA256SUMS --dir package
          (cd package && sha256sum --check --ignore-missing SHA256SUMS)
          echo "PACKAGE=package/${package}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Deploy
        if: env.ACTION == 'deploy'
        run: ssh relay "deploy ${VERSION}" < "$PACKAGE"
