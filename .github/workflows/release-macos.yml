name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  release:
    name: Build, sign, and notarize macOS arm64
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate signing configuration
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "${APPLE_API_ISSUER}"
          test -n "${APPLE_API_KEY_BASE64}"
          test -n "${APPLE_API_KEY_ID}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${CSC_KEY_PASSWORD}"
          test -n "${CSC_LINK}"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          apple_api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_API_KEY_PATH="${apple_api_key_path}" node -e 'require("node:fs").writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64"), { mode: 0o600 })'
          echo "APPLE_API_KEY=${apple_api_key_path}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed and notarized DMG
        run: pnpm --filter @cocurdex/desktop dist:mac:arm64
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify packaged runtime
        run: pnpm --filter @cocurdex/desktop verify:package release

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          app_path="release/mac-arm64/Cocurdex.app"
          dmg_path="release/Cocurdex-mac-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          hdiutil verify "${dmg_path}"
          shasum -a 256 "${dmg_path}" > "${dmg_path}.sha256"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "release/Cocurdex-mac-arm64.dmg"
          "release/Cocurdex-mac-arm64.dmg.sha256"
          --repo "${GITHUB_REPOSITORY}"
          --title "Cocurdex ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag

      - name: Remove App Store Connect API key
        if: always()
        run: |
          if test -n "${APPLE_API_KEY:-}"; then
            rm -f "${APPLE_API_KEY}"
          fi
