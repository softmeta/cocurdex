name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  release:
    name: Build, sign, and notarize macOS arm64
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Validate signing configuration
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "${APPLE_API_ISSUER}"
          test -n "${APPLE_API_KEY_BASE64}"
          test -n "${APPLE_API_KEY_ID}"
          test -n "${APPLE_TEAM_ID}"
          test -n "${CSC_KEY_PASSWORD}"
          test -n "${CSC_LINK}"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" origin/main

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cocurdex ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --draft

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          apple_api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_API_KEY_PATH="${apple_api_key_path}" node -e 'require("node:fs").writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64"), { mode: 0o600 })'
          echo "APPLE_API_KEY=${apple_api_key_path}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::${keychain_password}"
          printf '%s' "${CSC_LINK}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${CSC_KEY_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}" \
            >/dev/null
          existing_keychains="$(security list-keychains -d user | sed 's/"//g')"
          security list-keychains -d user -s "${keychain_path}" ${existing_keychains}
          rm -f "${certificate_path}"
          security find-identity -v -p codesigning "${keychain_path}" | grep -F "Developer ID Application"
          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "MAC_SIGNING_KEYCHAIN_PASSWORD=${keychain_password}"
          } >> "${GITHUB_ENV}"

      - name: Build signed and notarized DMG
        run: |
          set -euo pipefail
          security unlock-keychain -p "${MAC_SIGNING_KEYCHAIN_PASSWORD}" "${CSC_KEYCHAIN}"
          unset CSC_LINK CSC_KEY_PASSWORD
          pnpm --filter @cocurdex/desktop \
            ${{ github.ref_type == 'tag' && 'dist:mac:arm64:release' || 'dist:mac:arm64' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify packaged runtime
        run: pnpm --filter @cocurdex/desktop verify:package release

      - name: Verify signature and notarization
        working-directory: apps/desktop
        run: |
          app_path="release/mac-arm64/Cocurdex.app"
          dmg_path="release/Cocurdex-mac-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=2 "${app_path}"
          xcrun stapler validate "${app_path}"
          hdiutil verify "${dmg_path}"
          shasum -a 256 "${dmg_path}" > "${dmg_path}.sha256"

      - name: Attach checksum and publish GitHub release
        if: github.ref_type == 'tag'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "release/Cocurdex-mac-arm64.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cocurdex ${GITHUB_REF_NAME}" \
            --draft=false

      - name: Remove signing credentials
        if: always()
        run: |
          if test -n "${APPLE_API_KEY:-}"; then
            rm -f "${APPLE_API_KEY}"
          fi
          if test -n "${CSC_KEYCHAIN:-}"; then
            security delete-keychain "${CSC_KEYCHAIN}" || true
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"
