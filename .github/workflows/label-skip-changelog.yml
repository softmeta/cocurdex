name: Label skip-changelog

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    name: Apply skip-changelog from title
    runs-on: ubuntu-latest
    steps:
      - name: Add or remove skip-changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "${PR_TITLE}" =~ ^(chore|ci|docs|test)(\(.*\))?(!)?: ]]; then
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --add-label skip-changelog
          else
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --remove-label skip-changelog || true
          fi
