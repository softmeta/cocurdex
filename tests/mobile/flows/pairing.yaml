appId: dev.cocurdex.mobile
---
- launchApp:
    permissions:
      notifications: allow
- assertVisible: ${EMPTY_TITLE}
- assertVisible: ${EMPTY_SCAN}
- assertVisible: ${EMPTY_PASTE}
- takeScreenshot: empty
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_SCAN}
      - extendedWaitUntil:
          visible: ${SCAN_TITLE}
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: scan
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ${SCAN_UNREACHABLE}
          timeout: 15000
      - takeScreenshot: scan-unreachable
- setClipboard: ${PAIRING_LINK}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${SCAN_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "pairing-link"
        text: ${PAIRING_LINK}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "pairing-link"
            - eraseText: 120
            - inputText: ${PAIRING_LINK}
            - extendedWaitUntil:
                visible:
                  id: "pairing-link"
                  text: ${PAIRING_LINK}
                timeout: 10000
- takeScreenshot: pairing-sheet
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - runFlow:
          when:
            visible: ${PAIR_ACTION}
          commands:
            - tapOn: ${PAIR_ACTION}
      - extendedWaitUntil:
          notVisible:
            id: "pairing-link"
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: pairing-approval-status
    timeout: 5000
- assertVisible:
    id: pairing-approval-code
- takeScreenshot: pairing-approval
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 60000
- assertNotVisible: ${LINK_PLACEHOLDER}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 30000
- assertVisible:
    id: session-mode-switch
- takeScreenshot: assistant
- retry:
    maxRetries: 2
    commands:
      - longPressOn:
          id: assistant-${MODEL_TEST_ASSISTANT_ID}
      - assertVisible: ${EDIT_ASSISTANT}
- tapOn: ${EDIT_ASSISTANT}
- tapOn:
    id: assistant-form-model
- assertNotVisible:
    id: "assistant-form-model-.*/scroll-test-model-24"
- repeat:
    times: 7
    while:
      notVisible:
        id: "assistant-form-model-.*/scroll-test-model-24"
    commands:
      - swipe:
          start: "50%, 82%"
          end: "50%, 38%"
          duration: 450
- tapOn:
    id: "assistant-form-model-.*/scroll-test-model-24"
- tapOn: ${SAVE_ASSISTANT}
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - longPressOn:
          id: assistant-${MODEL_TEST_ASSISTANT_ID}
      - assertVisible: ${EDIT_ASSISTANT}
- tapOn: ${EDIT_ASSISTANT}
- assertVisible: ".*${LAST_ASSISTANT_MODEL}.*"
- tapOn: ${CLOSE_ACTION}
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 30000
- tapOn:
    id: session-mode-switch
- assertVisible:
    id: session-mode-assistant
- assertVisible:
    id: session-mode-work
- assertVisible:
    id: session-mode-chat
- takeScreenshot: session-modes
- tapOn: ${TAB_CHAT}
- assertNotVisible: ${MODEL_TEST_ASSISTANT}
- assertNotVisible: ${WORKSPACE_NAME}
- tapOn: ${NEW_CHAT}
- extendedWaitUntil:
    visible:
      id: new-chat-model
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "UIKeyboardLayoutStar.*"
          timeout: 10000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: "new-chat-model-.*/${AGENT_MODEL_ID}"
          commands:
            - tapOn:
                id: new-chat-model
      - extendedWaitUntil:
          visible:
            id: "new-chat-model-.*/${AGENT_MODEL_ID}"
          timeout: 5000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: "new-chat-model-.*/${AGENT_MODEL_ID}"
          commands:
            - tapOn:
                id: "new-chat-model-.*/${AGENT_MODEL_ID}"
      - extendedWaitUntil:
          visible:
            id: new-chat-prompt
          timeout: 10000
- tapOn:
    id: new-chat-prompt
- waitForAnimationToEnd
- setClipboard: ${CHAT_PROMPT}
- pasteText
- extendedWaitUntil:
    visible:
      id: new-chat-prompt
      text: ${CHAT_PROMPT}
    timeout: 10000
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: new-chat-prompt
          commands:
            - tapOn:
                text: ${SEND_ACTION}
                enabled: true
      - extendedWaitUntil:
          visible:
            id: composer-input
          timeout: 15000
- assertVisible: ${CHAT_PROMPT}
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 30000
- tapOn:
    id: session-mode-switch
- tapOn: ${TAB_CHAT}
- extendedWaitUntil:
    visible:
      id: "session-row-.*"
    timeout: 15000
- takeScreenshot: chat
- tapOn:
    id: session-mode-switch
- tapOn:
    id: session-mode-assistant
- extendedWaitUntil:
    visible: ${MODEL_TEST_ASSISTANT}
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - runFlow: shared/open-work.yaml
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 30000
- takeScreenshot: sessions
- tapOn: ${TAB_SETTINGS}
- assertNotVisible:
    id: session-mode-switch
- tapOn:
    id: sessions-tab
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 10000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${LIST_OPTIONS_ACTION}
      - extendedWaitUntil:
          visible:
            id: list-option-statuses
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: list-options
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-none
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-none
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: list-option-grouping
      - extendedWaitUntil:
          visible:
            id: list-choice-workspace
          timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: list-choice-workspace
      - extendedWaitUntil:
          visible:
            id: list-option-grouping
          timeout: 5000
- tapOn: ${LIST_OPTIONS_CLOSE}
- extendedWaitUntil:
    visible: ${WORKSPACE_NAME}
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_SETTINGS}
      - tapOn:
          id: settings-computers
      - extendedWaitUntil:
          visible:
            id: "host-row-.*"
          timeout: 5000
- takeScreenshot: paired
- longPressOn:
    id: "host-row-.*"
- extendedWaitUntil:
    visible:
      id: computer-action-details
    timeout: 5000
- takeScreenshot: computer-actions
- tapOn:
    id: computer-action-details
- extendedWaitUntil:
    visible:
      id: computer-scope-read
    timeout: 5000
- takeScreenshot: computer-detail
- tapOn:
    id: computer-rename
- extendedWaitUntil:
    visible:
      id: rename-computer-name
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: rename-computer-name
            focused: true
          timeout: 5000
- eraseText: 80
- inputText: ${RENAMED_COMPUTER}
- tapOn: ${RENAME_COMPUTER_SAVE}
- extendedWaitUntil:
    visible: ${RENAMED_COMPUTER}
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: rename-computer-name
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 3
          commands:
            - waitForAnimationToEnd
            - tapOn:
                point: 5%, 9%
            - extendedWaitUntil:
                visible:
                  id: "host-row-.*"
                timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "host-row-.*"
    timeout: 5000
- assertVisible: ${RENAMED_COMPUTER}
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 3
          commands:
            - waitForAnimationToEnd
            - tapOn:
                point: 5%, 9%
            - extendedWaitUntil:
                visible:
                  id: settings-computers
                timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: settings-computers
    timeout: 5000
- assertVisible: ".*${RENAMED_COMPUTER}.*"
- tapOn: ${TAB_SETTINGS}
- waitForAnimationToEnd
- takeScreenshot: settings
- tapOn:
    id: settings-language
- extendedWaitUntil:
    visible:
      id: settings-language-zh-CN
    timeout: 5000
- assertVisible:
    id: settings-language-en-US
- takeScreenshot: settings-language
- tapOn:
    id: settings-language-system
- extendedWaitUntil:
    visible:
      id: settings-archived
    timeout: 5000
