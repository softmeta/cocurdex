appId: dev.cocurdex.mobile
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: ${EMPTY_TITLE}
    timeout: 30000
- setClipboard: ${PAIRING_LINK}
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${EMPTY_PASTE}
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - extendedWaitUntil:
          visible:
            id: "pairing-link"
          timeout: 5000
- runFlow:
    when:
      notVisible:
        id: "pairing-link"
        text: ${PAIRING_LINK}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "pairing-link"
            - eraseText: 120
            - inputText: ${PAIRING_LINK}
            - extendedWaitUntil:
                visible:
                  id: "pairing-link"
                  text: ${PAIRING_LINK}
                timeout: 10000
- extendedWaitUntil:
    visible:
      text: ${PAIR_ACTION}
      enabled: true
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: ${SYSTEM_CONTINUE}
          optional: true
      - runFlow:
          when:
            visible:
              text: ${PAIR_ACTION}
          commands:
            - tapOn: ${PAIR_ACTION}
      - extendedWaitUntil:
          visible:
            id: "assistant-section-agents"
          timeout: 15000
- retry:
    maxRetries: 2
    commands:
      - tapOn: ${TAB_SESSIONS}
      - extendedWaitUntil:
          visible: ${WORKSPACE_NAME}
          timeout: 30000
